# Workflow para compilar o projeto Java (Maven) e executar a verificação de concursos em background

name: Concursos News Scraper Bot

on:
  schedule:
    # Executa a cada 6 horas no minuto 0 (Ex: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite acionar manualmente no painel "Actions"

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Iniciar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar e empacotar aplicação
      run: mvn -B clean package -DskipTests

    - name: Executar bot de verificação de concursos
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DATABASE_USER: ${{ secrets.DATABASE_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        MONITOR_ESTADOS_PRIORITARIOS: ${{ secrets.MONITOR_ESTADOS_PRIORITARIOS }}
        MONITOR_FILTRO_TI_HABILITADO: ${{ secrets.MONITOR_FILTRO_TI_HABILITADO }}
        NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        SCRAPER_EXECUTE_ON_STARTUP: ${{ secrets.SCRAPER_EXECUTE_ON_STARTUP }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Executa o JAR gerado na pasta target/
        java -jar target/*.jar
